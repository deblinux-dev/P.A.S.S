# ============================================================
# P.A.S.S. — CI
# ------------------------------------------------------------
# Сборка клиента P.A.S.S. (DynamoRIO) + лаунчеров + тестов:
#   * Linux x86-64:  libpass_client.so + ./pass  + полный
#                    регрессионный прогон tests/run_all.sh
#   * Windows x64:   pass_client.dll (MSVC) + pass.exe + smoke
#                    selftest.exe под drrun -target core2
# Тег v* → GitHub Release с готовыми архивами.
# ============================================================
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  DR_VERSION: "11.91.20763"

jobs:
  linux:
    name: Linux x86-64 — build + tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install CMake 3.x (<4)
        run: |
          python3 -m pip install --quiet --break-system-packages "cmake==3.31.6" \
            || python3 -m pip install --quiet "cmake==3.31.6"
          echo "$(python3 -c 'import cmake; print(cmake.CMAKE_BIN_DIR)')" >> "$GITHUB_PATH"
          cmake --version

      - name: Cache DynamoRIO
        id: dr
        uses: actions/cache@v4
        with:
          path: dynamorio
          key: dr-linux-${{ env.DR_VERSION }}

      - name: Download DynamoRIO
        if: steps.dr.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/DynamoRIO/dynamorio/releases/download/cronbuild-${DR_VERSION}/DynamoRIO-Linux-${DR_VERSION}.tar.gz"
          for i in 1 2 3 4 5; do
            echo "попытка $i/5..."
            if curl -L --fail --retry 3 --retry-all-errors --connect-timeout 30 -o dr.tar.gz "$URL"; then
              break
            fi
            rm -f dr.tar.gz
            sleep 20
          done
          test -s dr.tar.gz || { echo "не удалось скачать DynamoRIO после 5 попыток"; exit 1; }
          tar xzf dr.tar.gz
          rm dr.tar.gz
          mv "DynamoRIO-Linux-${DR_VERSION}" dynamorio

      - name: Build libpass_client.so
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
                -DDynamoRIO_DIR="$PWD/dynamorio/cmake"
          cmake --build build --parallel "$(nproc)"
          ls -l build/libpass_client.so

      - name: Guard — клиент без инструкций вне SSE2-базовой линии
        # раунд #114: __popcnt64 (MSVC) компилировался в POPCNT → #UD
        # внутри клиента на реальном CPU без SSE4.2 (internal crash
        # B-2003). Скан наших объектников ловит весь класс (AVX/SSE4/
        # POPCNT/LZCNT/BMI/AES/...) независимо от toolchain.
        run: |
          set -e
          : > guard_disasm.txt
          for o in build/CMakeFiles/pass_client.dir/src/*.o; do
            echo "=== $o" >> guard_disasm.txt
            objdump -d "$o" >> guard_disasm.txt
          done
          python3 scripts/scan_baseline.py guard_disasm.txt

      - name: Regression tests (tests/run_all.sh)
        run: |
          bash tests/run_all.sh "$PWD/build/libpass_client.so" "$PWD/dynamorio/bin64/drrun"

      - name: Package PASS-linux-x64.zip
        run: |
          mkdir -p pkg/docs
          cp build/libpass_client.so pkg/
          cp tools/pass.sh pkg/pass
          chmod +x pkg/pass
          cp README.md LICENSE pkg/
          cp docs/ARCHITECTURE.md docs/COVERAGE.md docs/WINDOWS.md pkg/docs/
          (cd pkg && zip -qr ../PASS-linux-x64.zip .)
          ls -l PASS-linux-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PASS-linux-x64
          path: PASS-linux-x64.zip

  windows:
    name: Windows x64 — build + smoke
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake 3.x (<4)
        shell: bash
        run: |
          python -m pip install --quiet "cmake==3.31.6"
          echo "$(python -c 'import cmake; print(cmake.CMAKE_BIN_DIR)')" >> "$GITHUB_PATH"
          cmake --version

      - name: Cache DynamoRIO
        id: dr
        uses: actions/cache@v4
        with:
          path: dynamorio
          key: dr-win-${{ env.DR_VERSION }}

      - name: Download DynamoRIO
        if: steps.dr.outputs.cache-hit != 'true'
        shell: bash
        run: |
          URL="https://github.com/DynamoRIO/dynamorio/releases/download/cronbuild-${DR_VERSION}/DynamoRIO-Windows-${DR_VERSION}.zip"
          for i in 1 2 3 4 5; do
            echo "попытка $i/5..."
            if curl -L --fail --retry 3 --retry-all-errors --connect-timeout 30 -o dr.zip "$URL"; then
              break
            fi
            rm -f dr.zip
            sleep 20
          done
          test -s dr.zip || { echo "не удалось скачать DynamoRIO после 5 попыток"; exit 1; }
          powershell -NoProfile -Command "Expand-Archive -Path dr.zip -DestinationPath . -Force"
          rm -f dr.zip
          mv "DynamoRIO-Windows-${DR_VERSION}" dynamorio

      - name: Build pass_client.dll (MSVC)
        shell: bash
        run: |
          cmake -S . -B build -DDynamoRIO_DIR="$(pwd -W)/dynamorio/cmake"
          cmake --build build --config Release
          ls -l build/Release/pass_client.dll

      - name: Guard — клиент без инструкций вне SSE2-базовой линии
        # раунд #114: MSVC НЕ блокирует intrinsic-и флагами — __popcnt64
        # в emu.c дал POPCNT (F3 0F B8) → #UD на целевом CPU без SSE4.2
        # (internal crash B-2003 на bun_bl.exe). Скан НАШИХ .obj (не
        # DLL: статический CRT содержит ISA-диспетчеризуемые memcpy с
        # AVX2-путями и XGETBV в __isa_available_init — они под
        # CPUID-гвардом CRT и на целевом CPU не исполняются).
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
          PYTHONIOENCODING: "utf-8"
          PYTHONUTF8: "1"
        run: |
          set -e
          : > guard_disasm.txt
          for o in build/CMakeFiles/pass_client.dir/src/*.obj; do
            echo "=== $o" >> guard_disasm.txt
            dumpbin /DISASM:BYTES "$o" >> guard_disasm.txt
          done
          python scripts/scan_baseline.py guard_disasm.txt

      - name: Build pass.exe and selftest.exe
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cl /O2 /Fe:pass.exe tools/pass_launcher.c
          cl /O2 /arch:AVX2 /Fe:selftest.exe tests/data/selftest.c
          ls -l pass.exe selftest.exe

      - name: Smoke — selftest under drrun -target core2
        shell: bash
        run: |
          cp build/Release/pass_client.dll .
          run_smoke() {
            timeout 100 dynamorio/bin64/drrun.exe -c pass_client.dll -target core2 -- selftest.exe > smoke.log 2>&1
          }
          if run_smoke; then
            echo "selftest под P.A.S.S. (попытка 1): OK"
          elif run_smoke; then
            echo "selftest под P.A.S.S. (попытка 2): OK"
          else
            echo "  [XFAIL] selftest под Windows — крах/зависание, известный класс"
            echo "          багов (ARCHITECTURE.md §7.1, приоритет v0.3)"
            echo "  ── последние строки smoke.log ──"
            tail -12 smoke.log || true
          fi

      - name: Smoke — tname.exe (thread-name исключение, фикс Godot B-2015)
        # 0x406D1388 без __try-обёртки: под DR <=v0.2.4 уходил в unhandled →
        # процесс умирал с ExitStatus 0x406D1388 (репрод Godot 4.5 у
        # пользователя). Клиент B-2015 обязан ГЛОТАТЬ это исключение.
        # Нативный контроль — информационный (система может глотать сама
        # или нет — драйверы всегда оборачивают в __except и не падают).
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          cl /O2 /Fe:tname.exe tests/data/tname.c
          echo "── нативный контроль (информационный):"
          rc=0
          timeout 60 ./tname.exe > tname_native.log 2>&1 || rc=$?
          if [ $rc -eq 0 ]; then
            echo "native: TNAME-OK (система глотает unhandled)"
          else
            echo "native: rc=$rc (умер — unhandled 0x406D1388 не глотается системой; драйверы всегда оборачивают в __except)"
          fi
          echo "── под P.A.S.S.:"
          rc=0
          timeout 60 dynamorio/bin64/drrun.exe -c pass_client.dll -target penryn -- tname.exe > tname_dr.log 2>&1 || rc=$?
          echo "rc=$rc; полный лог:"
          cat tname_dr.log
          if [ $rc -ne 0 ] || ! grep -q "TNAME-OK" tname_dr.log; then
            echo "── ДИАГНОСТИКА: syscall-трейс (номера 300-400 + хвост):"
            timeout 60 dynamorio/bin64/drrun.exe -c pass_client.dll -target penryn -verbose 1 -strace -- tname.exe > tname_strace.log 2>&1 || true
            echo "строк в трейсе: $(wc -l < tname_strace.log || echo 0)"
            (grep -E "SC 3[0-9][0-9]" tname_strace.log | head -40) || true
            (grep -E "swallow|EXC\]" tname_strace.log | head -20) || true
            echo "── последние 15 syscall'ов перед смертью:"
            (grep "\[SC" tname_strace.log | tail -15) || true
            echo "── хвост трейса целиком:"
            (tail -25 tname_strace.log) || true
            echo "FAIL: 0x406D1388 не проглочен — регрессия фикса Godot B-2015"
            exit 1
          fi
          echo "tname под P.A.S.S.: TNAME-OK, rc=0 — фикс работает"

      - name: Package PASS-win-x64.zip
        shell: bash
        run: |
          mkdir -p pkg/docs
          cp pass.exe pass_client.dll README.md LICENSE pkg/
          cp docs/ARCHITECTURE.md docs/COVERAGE.md docs/WINDOWS.md pkg/docs/
          powershell -NoProfile -Command "Compress-Archive -Path pkg\\* -DestinationPath PASS-win-x64.zip -Force"
          ls -l PASS-win-x64.zip

      - name: Smoke — launcher pass.exe (DYNAMORIO_HOME)
        shell: bash
        timeout-minutes: 3
        run: |
          DYNAMORIO_HOME="$PWD/dynamorio" timeout 120 pkg/pass.exe -target core2 -- selftest.exe > launcher.log 2>&1 \
            || { echo "── launcher.log ──"; cat launcher.log; }
          echo "pass.exe: запуск выполнен (код возврата не фатален для CI)"

      - uses: actions/upload-artifact@v4
        with:
          name: PASS-win-x64
          path: PASS-win-x64.zip

  windows-bun:
    name: Windows — bun.exe под P.A.S.S. (диагностика)
    needs: [windows]
    runs-on: windows-latest
    # Жёсткий потолок job'а: осиротевший зависший bun.exe не должен держать
    # ран бесконечно (step-таймаут не убивает дерево процессов на Windows).
    # 60 мин: диагностические кейсы §7.3 имеют TMO=600с.
    timeout-minutes: 60
    continue-on-error: true   # hang bun — известный класс §7.2; не краснит CI
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache DynamoRIO
        id: dr
        uses: actions/cache@v4
        with:
          path: dynamorio
          key: dr-win-${{ env.DR_VERSION }}

      - name: Download DynamoRIO
        if: steps.dr.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/DynamoRIO/dynamorio/releases/download/cronbuild-${DR_VERSION}/DynamoRIO-Windows-${DR_VERSION}.zip"
          for i in 1 2 3 4 5; do
            echo "попытка $i/5..."
            if curl -L --fail --retry 3 --retry-all-errors --connect-timeout 30 -o dr.zip "$URL"; then
              break
            fi
            rm -f dr.zip
            sleep 20
          done
          test -s dr.zip || { echo "не удалось скачать DynamoRIO после 5 попыток"; exit 1; }
          powershell -NoProfile -Command "Expand-Archive -Path dr.zip -DestinationPath . -Force"
          rm -f dr.zip
          mv "DynamoRIO-Windows-${DR_VERSION}" dynamorio

      - name: Артефакт (pass.exe + pass_client.dll) от windows-job
        uses: actions/download-artifact@v4
        with:
          name: PASS-win-x64

      - name: Распаковать pass.exe и pass_client.dll
        run: |
          powershell -NoProfile -Command "Expand-Archive -Path PASS-win-x64.zip -DestinationPath rel -Force"
          cp rel/pass.exe rel/pass_client.dll .
          ls -l pass.exe pass_client.dll

      - name: Bun — download windows-x64 + baseline
        timeout-minutes: 5
        run: |
          curl -L --fail --retry 3 --connect-timeout 30 -o bunx.zip \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          curl -L --fail --retry 3 --connect-timeout 30 -o bunb.zip \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64-baseline.zip"
          mkdir -p bun-x64 bun-baseline
          powershell -NoProfile -Command "Expand-Archive -Path bunx.zip -DestinationPath bun-x64 -Force"
          powershell -NoProfile -Command "Expand-Archive -Path bunb.zip -DestinationPath bun-baseline -Force"
          rm -f bunx.zip bunb.zip
          BUN_X64="$(find bun-x64 -name bun.exe | head -1)"
          BUN_BASE="$(find bun-baseline -name bun.exe | head -1)"
          test -n "$BUN_X64" && test -n "$BUN_BASE"
          "$BUN_X64" --version
          echo "bun x64 и baseline скачаны"

      - name: Bun под P.A.S.S. и под чистым DR (10 кейсов)
        # Итог — в лог, Step Summary и аннотации. Каждый кейс: TERM через 75с
        # (можно перекрыть env TMO), принудительный KILL ещё через 5с.
        timeout-minutes: 60
        run: |
          BUN_X64="$(find bun-x64 -name bun.exe | head -1)"
          BUN_BASE="$(find bun-baseline -name bun.exe | head -1)"
          DRRUN="dynamorio/bin64/drrun.exe"
          export DYNAMORIO_HOME="$PWD/dynamorio"
          RES=/tmp/bun_results.md
          : > "$RES"

          run_case() {
            name="$1"; shift
            t0=$(date +%s)
            rc=0
            timeout -k 5 "${TMO:-75}" "$@" > bun_out.txt 2> bun_err.txt || rc=$?
            t1=$(date +%s)
            dt=$((t1 - t0))
            out="$(head -c 200 bun_out.txt | tr '\r\n' ' ')"
            err="$(tail -c 200 bun_err.txt | tr '\r\n' ' ')"
            if [ "$rc" -eq 0 ]; then
              verdict="OK"; ann="notice"
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              verdict="HANG (убит по таймауту 75с)"; ann="warning"
            elif [ "$rc" -eq 86 ]; then
              verdict="STOP — сработал предохранитель trap-цикла"; ann="warning"
            else
              verdict="FAIL rc=$rc"; ann="warning"
            fi
            printf "| %s | %s | %ss | `%s%s` |\n" "$name" "$verdict" "$dt" "$out" "$err" >> "$RES"
            echo "── $name → $verdict (${dt}s)"
            [ -n "$out" ] && echo "   stdout: $out"
            if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
              echo "   stderr при зависании (последние 30 строк):"
              tail -30 bun_err.txt | sed 's/^/     /' || true
            elif [ -n "$err" ]; then
              echo "   stderr: $err"
              # §7.3: полный хвост stderr на FAIL — баннер клиента в
              # самом конце, виновник (паника/UNENCODABLE/СТАБ) ВЫШЕ
              tail -c 4000 bun_err.txt | sed 's/^/     /' || true
              echo "   stdout (полный): $(cat bun_out.txt 2>/dev/null)"
            fi
            echo "::$ann::$name → $verdict"
          }

          echo "==== 1/10 native ====";                run_case "bun --version (нативно, контроль)"      "$BUN_X64" --version
          echo "==== 2/10 native ====";                run_case "bun -e console.log (нативно, контроль)" "$BUN_X64" -e "console.log('Hello from bun!')"
          echo "==== 3/10 чистый DR ====";             run_case "drrun без клиента -- bun --version (контроль §7.2)" "$DRRUN" -- "$BUN_X64" --version
          echo "==== 4/10 client, native target ===="; run_case "pass -target native -- bun --version (DR+клиент, без переписывания)" ./pass.exe -target native -- "$BUN_X64" --version
          # §7.3: краш 0x71082a06 — ВНУТРИ dynamorio.dll: instr_encode_arch
          # пишет GS-префикс 0x65 по NULL-буферу (encode-to-NULL, fault#1).
          # VMM-теория опровергнута (-vm_size 1G не меняет ничего).
          # Релизный DR не логирует (loglevel — только в DEBUG-сборке).
          # Краш = fault#1 в DR → репорт → сам репорт падает (порча).
          # Эксперименты: (а) когда в старте bun; (б) зависят ли от размера BB;
          # (в) от размера стека DR.
          for t in 8 16 32 64; do
            TMO=$t timeout -k 5 $t "$DRRUN" -c pass_client.dll -target core2 -- "$BUN_X64" --version > bo.txt 2> be.txt || true
            if grep -q "internal crash" be.txt; then echo "── брекетинг: краш УЖЕ при TMO=${t}s"; break; else echo "── брекетинг: TMO=${t}s — краша нет ($(head -c 60 bo.txt | tr '\r\n' ' '))"; fi
          done
          echo "==== 4b/10 max_bb_instrs ===="; TMO=200 run_case "drrun -ops max_bb_instrs 64 -- bun --version (маленькие BB)" "$DRRUN" -ops "-max_bb_instrs 64" -c pass_client.dll -target core2 -- "$BUN_X64" --version
          echo "==== 4c/10 stack_size ====";    TMO=200 run_case "drrun -ops stack_size 256K -- bun --version" "$DRRUN" -ops "-stack_size 256K" -c pass_client.dll -target core2 -- "$BUN_X64" --version
          echo "==== 5/10 полный P.A.S.S. ====";       run_case "pass -target core2 -- bun --version"    ./pass.exe -target core2 -- "$BUN_X64" --version
          echo "==== 5b/17 бисекция fault#1: -noveh ====";              run_case "pass -noveh -target core2 -- bun --version" ./pass.exe -noveh -target core2 -- "$BUN_X64" --version
          echo "==== 5c/17 бисекция fault#1: -noproxy ====";            run_case "pass -noproxy -target core2 -- bun --version" ./pass.exe -noproxy -target core2 -- "$BUN_X64" --version
          echo "==== 5d/17 бисекция fault#1: -trap 0 ====";            run_case "pass -trap 0 -target core2 -- bun --version" ./pass.exe -trap 0 -target core2 -- "$BUN_X64" --version
          echo "==== 5e/17 бисекция fault#1: -generic 0 ====";          run_case "pass -generic 0 -target core2 -- bun --version" ./pass.exe -generic 0 -target core2 -- "$BUN_X64" --version
          echo "==== 5f/17 бисекция fault#1: -inline 0 ====";           run_case "pass -inline 0 -target core2 -- bun --version" ./pass.exe -inline 0 -target core2 -- "$BUN_X64" --version
          echo "==== 5g/17 бисекция fault#1: -expose_emulated 0 ====";  run_case "pass -expose_emulated 0 -target core2 -- bun --version (CPUID — честный Core 2, без эмулируемых фич)" ./pass.exe -expose_emulated 0 -target core2 -- "$BUN_X64" --version
          echo "==== 5h/17 бисекция fault#1: -stage 1 (контроль) ===="; run_case "pass -stage 1 -target core2 -- bun --version (клиент инертен — якорь)" ./pass.exe -stage 1 -target core2 -- "$BUN_X64" --version
          # раунд 2: translation-фикс (все стабы получают app-PC) + гранулярные гейты
          echo "==== 5i/26 РАУНД-2: translation-фикс, базовый режим ===="; run_case "pass -target core2 -- bun -e 'console.log(6*7)' (translation-фикс, реальный JS)" ./pass.exe -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          echo "==== 5j/26 РАУНД-2: generic-only на реальном JS ====";        run_case "pass -inline 0 -target core2 -- bun -e 'console.log(6*7)' (fallback-режим)" ./pass.exe -inline 0 -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          echo "==== 5k/26 РАУНД-2: -ops -disable_traces ====";                    TMO=200 run_case "drrun -ops -disable_traces -c pass_client.dll -target core2 -- bun --version" "$DRRUN" -ops "-disable_traces" -c pass_client.dll -target core2 -- "$BUN_X64" --version
          echo "==== 5l/26 гранулярный: -no256 ====";   run_case "pass -no256 -target core2 -- bun --version" ./pass.exe -no256 -target core2 -- "$BUN_X64" --version
          echo "==== 5m/26 гранулярный: -no128 ====";   run_case "pass -no128 -target core2 -- bun --version" ./pass.exe -no128 -target core2 -- "$BUN_X64" --version
          echo "==== 5n/26 гранулярный: -nospecial ===="; run_case "pass -nospecial -target core2 -- bun --version" ./pass.exe -nospecial -target core2 -- "$BUN_X64" --version
          echo "==== 5o/26 гранулярный: -nobcast ===="; run_case "pass -nobcast -target core2 -- bun --version" ./pass.exe -nobcast -target core2 -- "$BUN_X64" --version
          echo "==== 5p/26 гранулярный: -nomsk ====";   run_case "pass -nomsk -target core2 -- bun --version" ./pass.exe -nomsk -target core2 -- "$BUN_X64" --version
          echo "==== 5q/26 гранулярный: -novz ====";    run_case "pass -novz -target core2 -- bun --version" ./pass.exe -novz -target core2 -- "$BUN_X64" --version
          echo "==== 6/10 verbose-диагностика ====";   PASS_EXCLOG=1 PASS_SEGVDUMP=1 run_case "pass -verbose 3 -target core2 -- bun --version (поток исключений)" ./pass.exe -verbose 3 -target core2 -- "$BUN_X64" --version
          [ -f modmap.txt ] && { echo "── карта модулей:"; cat modmap.txt; } || true
          echo "==== 7/10 кириллица ====";             run_case "pass -target core2 -- bun -e 'Привет от Bun!'" ./pass.exe -target core2 -- "$BUN_X64" -e "console.log('Привет от Bun!')"
          echo "==== 8/10 baseline-сборка ====";       run_case "pass -target core2 -- bun(baseline) --version" ./pass.exe -target core2 -- "$BUN_BASE" --version
          echo "==== 9/10 baseline-сборка ====";       run_case "pass -target core2 -- bun(baseline) -e 'Hello!'" ./pass.exe -target core2 -- "$BUN_BASE" -e "console.log('Hello from P.A.S.S. baseline!')"
          echo "==== 10/10 hello-ascii ====";          run_case "pass -target core2 -- bun -e 'Hello from P.A.S.S.!'" ./pass.exe -target core2 -- "$BUN_X64" -e "console.log('Hello from P.A.S.S.!')"
          echo "==== JS-охота §7.3: лестница подсистем ===="
          TMO=60 run_case "bun -e '0' (чистая инициализация VM)" ./pass.exe -target core2 -- "$BUN_X64" -e "0"
          TMO=60 run_case "bun -e '1+1' (арифметика JSC)" ./pass.exe -target core2 -- "$BUN_X64" -e "1+1"
          TMO=60 run_case "bun -e 'new Date().getTime()' (встроенные объекты)" ./pass.exe -target core2 -- "$BUN_X64" -e "new Date().getTime()"
          TMO=60 run_case "bun -e 'Promise.resolve(1).then(v=>console.log(v))' (event loop)" ./pass.exe -target core2 -- "$BUN_X64" -e "Promise.resolve(1).then(v=>console.log(v))"
          echo "==== JS-охота §7.3: матрица JS × гейты ===="
          for G in -no256 -no128 -nospecial -nomsk -novz -noveh -noproxy; do
            TMO=60 run_case "bun -e 'console.log(6*7)' $G" ./pass.exe $G -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          done
          echo "==== JS-охота §7.3: CMPBUF — сверка спилов с контекстом ===="
          PASS_CMPBUF=1 TMO=90 run_case "bun -e '0' + PASS_CMPBUF=1 (десинк носителя?)" ./pass.exe -target core2 -- "$BUN_X64" -e "0"
          echo "==== JS-охота §7.3: режимы без -e ===="
          printf 'console.log(6*7)\n' > jsfile.js
          TMO=60 run_case "bun jsfile.js (файловый режим)" ./pass.exe -target core2 -- "$BUN_X64" jsfile.js
          TMO=60 run_case "bun --print '6*7'" ./pass.exe -target core2 -- "$BUN_X64" --print "6*7"
          echo "==== JS-охота §7.3: бисекция механизма ===="
          TMO=60 run_case "drrun БЕЗ клиента -- bun -e 'console.log(6*7)' (контроль: DR сам по себе)" "$DRRUN" -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "pass -stage 1 -- bun -e 'console.log(6*7)' (клиент ИНЕРТЕН — якорь рерайта)" ./pass.exe -stage 1 -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=90 run_case "pass -inline 0 -generic 0 -- bun -e '0' (только VMOV/trap — рерайт почти пуст)" ./pass.exe -inline 0 -generic 0 -target core2 -- "$BUN_X64" -e "0"
          TMO=90 run_case "pass -inline 0 -nospecial -nomsk -novz -- bun -e '0' (только generic-emu)" ./pass.exe -inline 0 -nospecial -nomsk -novz -target core2 -- "$BUN_X64" -e "0"
          echo "==== JS-охота §7.3: бисекция по emu_mask (пути диспетчера bun) ===="
          # база = SSE41|SSE42|POPCNT|MOVBE + эмулируемые (0x7FFC)
          TMO=60 run_case "bun -e -emu_mask 0x7FFC (контроль = default)" ./pass.exe -emu_mask 7FFC -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x7FDC (без AES: RNG bun в обход AES-CTR)" ./pass.exe -emu_mask 7FDC -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x7EFC (без AVX2: только 128-бит пути)" ./pass.exe -emu_mask 7EFC -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x3C7C (без AVX/AVX2/FMA/F16C: чистый SSE)" ./pass.exe -emu_mask 3C7C -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x73FC (без BMI1/BMI2: без tzcnt/pdep/shlx)" ./pass.exe -emu_mask 73FC -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x5FFC (без LZCNT)" ./pass.exe -emu_mask 5FFC -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x7F9C (без AES+PCLMUL)" ./pass.exe -emu_mask 7F9C -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          TMO=60 run_case "bun -e -emu_mask 0x18 (минимум: SSE42+POPCNT — без SSE41/MOVBE)" ./pass.exe -emu_mask 18 -target core2 -- "$BUN_X64" -e "console.log(6*7)"
          echo "==== JS-охота §7.3: трейс рерайта ===="
          TMO=120 run_case "bun -e '0' -verbose 2 (все generic/отказы поопкодной) " ./pass.exe -verbose 2 -target core2 -- "$BUN_X64" -e "0"

          echo "" >> "$RES"
          echo "Ожидание по §7.2: на Linux чистый DR виснет на bun; на Windows (см. прогон) — совместим." >> "$RES"
          cat "$RES"
          cat "$RES" >> "$GITHUB_STEP_SUMMARY"

  windows-bun-debug:
    name: "Windows debug-DR — bun под core2 (охота за fault#1)"
    # Релизный DR не логирует (loglevel — только DEBUG-сборка), а debug-DR
    # на 900с не дошёл до точки краша. Отдельная джоба с 45-минутным кейсом:
    # debug DR громко ассертит и логирует причину внутреннего фолта.
    needs: [windows]
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache DynamoRIO
        id: dr
        uses: actions/cache@v4
        with:
          path: dynamorio
          key: dr-win-${{ env.DR_VERSION }}

      - name: Download DynamoRIO
        if: steps.dr.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/DynamoRIO/dynamorio/releases/download/cronbuild-${DR_VERSION}/DynamoRIO-Windows-${DR_VERSION}.zip"
          for i in 1 2 3 4 5; do
            echo "попытка $i/5..."
            if curl -L --fail --retry 3 --retry-all-errors --connect-timeout 30 -o dr.zip "$URL"; then
              break
            fi
            rm -f dr.zip
            sleep 20
          done
          test -s dr.zip || { echo "не удалось скачать DynamoRIO после 5 попыток"; exit 1; }
          powershell -NoProfile -Command "Expand-Archive -Path dr.zip -DestinationPath . -Force"
          rm -f dr.zip
          mv "DynamoRIO-Windows-${DR_VERSION}" dynamorio

      - name: Артефакт (pass.exe + pass_client.dll) от windows-job
        uses: actions/download-artifact@v4
        with:
          name: PASS-win-x64

      - name: Распаковать pass.exe и pass_client.dll
        run: |
          powershell -NoProfile -Command "Expand-Archive -Path PASS-win-x64.zip -DestinationPath rel -Force"
          cp rel/pass.exe rel/pass_client.dll .
          ls -l pass.exe pass_client.dll

      - name: Bun — download windows-x64
        timeout-minutes: 5
        run: |
          curl -L --fail --retry 3 --connect-timeout 30 -o bunx.zip \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          mkdir -p bun-x64
          powershell -NoProfile -Command "Expand-Archive -Path bunx.zip -DestinationPath bun-x64 -Force"
          rm -f bunx.zip
          BUN_X64="$(find bun-x64 -name bun.exe | head -1)"
          test -n "$BUN_X64"
          "$BUN_X64" --version

      - name: debug-DR — bun --version (45 мин)
        timeout-minutes: 50
        run: |
          BUN_X64="$(find bun-x64 -name bun.exe | head -1)"
          DRRUN="dynamorio/bin64/drrun.exe"
          echo "старт debug-DR прогона (с логом DR)..."
          rc=0
          timeout -k 5 2700 "$DRRUN" -debug -ops "-loglevel 1 -log_to_stderr" -c pass_client.dll -target core2 -- "$BUN_X64" --version > dbg_out.txt 2> dbg_err.txt || rc=$?
          echo "rc=$rc"
          echo "── stderr: последние 60 строк"
          tail -60 dbg_err.txt | sed 's/^/     /' || true
          echo "── stdout: $(head -c 200 dbg_out.txt)"
          echo "── ASSERT/Ошибка в stderr:"
          grep -iE "assert|internal|error|exception" dbg_err.txt | head -20 || echo "(нет)"

  windows-bun-mingw:
    name: Windows (MinGW) — bun.exe под P.A.S.S.
    # Гипотеза §7.3: краш -target core2 на bun — дефект MSVC-сборки
    # клиента; тот же исходник с MinGW (как на Linux/GCC, KAT 231/231)
    # должен работать. Говорит что угодно: selftest-якорь + bun-кейсы.
    needs: [windows]
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Cache DynamoRIO
        id: dr
        uses: actions/cache@v4
        with:
          path: dynamorio
          key: dr-win-${{ env.DR_VERSION }}

      - name: Download DynamoRIO
        if: steps.dr.outputs.cache-hit != 'true'
        run: |
          URL="https://github.com/DynamoRIO/dynamorio/releases/download/cronbuild-${DR_VERSION}/DynamoRIO-Windows-${DR_VERSION}.zip"
          for i in 1 2 3 4 5; do
            echo "попытка $i/5..."
            if curl -L --fail --retry 3 --retry-all-errors --connect-timeout 30 -o dr.zip "$URL"; then
              break
            fi
            rm -f dr.zip
            sleep 20
          done
          test -s dr.zip || { echo "не удалось скачать DynamoRIO после 5 попыток"; exit 1; }
          powershell -NoProfile -Command "Expand-Archive -Path dr.zip -DestinationPath . -Force"
          rm -f dr.zip
          mv "DynamoRIO-Windows-${DR_VERSION}" dynamorio

      - name: Сборка клиента MinGW (gcc напрямую, без DR-cmake)
        # DR-cmake подмешивает MSVC-флаги (/MT /GS-) в gcc-команду —
        # собираем напрямую: release-drmgr_static.lib (DEBUG-версия не
        # содержит drmgr_* символов!) + import-lib dynamorio.dll.
        # find строго по lib64/release: в зипе раньше идёт lib32.
        run: |
          DLDLL="$(find dynamorio -path '*lib64/release*' -name 'dynamorio.dll' | head -1)"
          DRMGR="$(find dynamorio -path '*ext/lib64/release*' -name 'drmgr_static.lib' | head -1)"
          DRCNT="$(find dynamorio -path '*ext/lib64/release*' -name 'drcontainers.lib' | head -1)"
          test -n "$DLDLL" && test -n "$DRMGR" && test -n "$DRCNT"
          echo "DLDLL=$DLDLL"; echo "DRMGR=$DRMGR"; echo "DRCNT=$DRCNT"
          # .def из 64-битного DLL. Строки имён имеют вид "[   42] имя";
          # заголовок "[Ordinal/Name Pointer] Table -- Ordinal Base 1"
          # тоже начинается с '[' — отсекаем требованием $2 = число].
          {
            printf 'LIBRARY dynamorio.dll\nEXPORTS\n'
            objdump -p "$DLDLL" | sed -n '/\[Ordinal\/Name Pointer\] Table/,$p' \
              | awk 'NF>0 && $1=="[" && $2 ~ /^[0-9]+\]$/ {print $NF}' | sort -u
          } > dr.def
          echo "экспортов в .def: $(tail -n +3 dr.def | wc -l)"; head -4 dr.def
          grep -qx dr_fprintf dr.def
          dlltool -d dr.def -D "$DLDLL" -l dr_gcc.a -m i386:x86-64
          test -s dr_gcc.a && ls -l dr_gcc.a
          # -fcommon: глобальные данные из заголовков DR (_USES_DR_VERSION_,
          # _DR_CLIENT_AVX512_CODE_IN_USE_) в MSVC-объектах drmgr определены
          # явно; gcc 10+ (-fno-common) даёт второй экземпляр — конфликт.
          CFLAGS="-DNDEBUG -DWINDOWS -DX86_64 -std=gnu11 -O2 -g -fcommon -Isrc -Idynamorio/include -Idynamorio/ext/include -msse2 -mno-sse3 -mno-ssse3 -mno-sse4.1 -mno-sse4.2 -mno-popcnt -mno-avx -mno-avx2 -mno-fma -mno-bmi -mno-bmi2 -mno-lzcnt -mno-movbe -mno-aes -mno-pclmul"
          gcc $CFLAGS -c src/cpuid_hook.c -o cpuid_hook.o
          SRCS="src/pass.c src/features.c src/emu.c src/rewrite.c src/rewrite_vex.c src/rewrite_special.c src/restore_state.c src/trap.c src/segv_dump.c src/strace.c src/fuzz.c cpuid_hook.o"
          # порядок критичен: GNU ld обрабатывает архивы одним проходом,
          # поэтому drmgr_static (ссылается на dr_*) ДОЛЖЕН стоять раньше
          # dr_gcc.a; --start-group закрывает и обратные ссылки.
          if gcc -shared -o pass_client.dll $SRCS $CFLAGS \
               -Wl,--start-group "$DRMGR" "$DRCNT" dr_gcc.a -Wl,--end-group \
               -static-libgcc 2> link1.err; then
            echo "линк OK: import-lib от dlltool"
          else
            echo "== dlltool-импорт не разрешился; хвост ошибок:"
            tail -8 link1.err
            echo "== фолбэк: прямая линковка на dynamorio.dll"
            gcc -shared -o pass_client.dll $SRCS $CFLAGS \
              "$DLDLL" "$DRMGR" "$DRCNT" -static-libgcc \
              -Wl,--allow-multiple-definition
            echo "линк OK: прямая линковка на DLL"
          fi
          ls -l pass_client.dll

      - name: Сборка лаунчера и selftest (MinGW)
        run: |
          gcc -O2 -o pass.exe tools/pass_launcher.c
          # GCC (в отличие от MSVC /arch:AVX2) не включает BMI1/BMI2/FMA/
          # LZCNT/AES/PCLMUL через -mavx2 — для KAT-интриnsics нужны явно:
          gcc -O2 -mavx2 -mbmi -mbmi2 -mlzcnt -mfma -maes -mpclmul -o selftest.exe tests/data/selftest.c
          gcc -O2 -o tname.exe tests/data/tname.c
          ls -l pass.exe selftest.exe tname.exe

      - name: Bun — download windows-x64 + baseline
        timeout-minutes: 5
        run: |
          curl -L --fail --retry 3 --connect-timeout 30 -o bunx.zip \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64.zip"
          curl -L --fail --retry 3 --connect-timeout 30 -o bunb.zip \
            "https://github.com/oven-sh/bun/releases/latest/download/bun-windows-x64-baseline.zip"
          mkdir -p bun-x64 bun-baseline
          powershell -NoProfile -Command "Expand-Archive -Path bunx.zip -DestinationPath bun-x64 -Force"
          powershell -NoProfile -Command "Expand-Archive -Path bunb.zip -DestinationPath bun-baseline -Force"
          rm -f bunx.zip bunb.zip
          BUN_X64="$(find bun-x64 -name bun.exe | head -1)"
          BUN_BASE="$(find bun-baseline -name bun.exe | head -1)"
          test -n "$BUN_X64" && test -n "$BUN_BASE"
          echo "bun x64 и baseline скачаны"

      - name: Кейсы — selftest + bun под MinGW-клиентом
        timeout-minutes: 20
        run: |
          BUN_X64="$(find bun-x64 -name bun.exe | head -1)"
          BUN_BASE="$(find bun-baseline -name bun.exe | head -1)"
          export DYNAMORIO_HOME="$PWD/dynamorio"
          RES=/tmp/mingw_results.md
          : > "$RES"

          run_case() {
            name="$1"; shift
            t0=$(date +%s)
            rc=0
            timeout -k 5 75 "$@" > case_out.txt 2> case_err.txt || rc=$?
            t1=$(date +%s)
            dt=$((t1 - t0))
            out="$(head -c 200 case_out.txt | tr '\r\n' ' ')"
            if [ "$rc" -eq 0 ]; then verdict="OK"; ann="notice"
            elif [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then verdict="HANG"; ann="warning"
            elif [ "$rc" -eq 86 ]; then verdict="STOP trap-fuse"; ann="warning"
            else verdict="FAIL rc=$rc"; ann="warning"; fi
            printf "| %s | %s | %ss | `%s` |\n" "$name" "$verdict" "$dt" "$out" >> "$RES"
            echo "── $name → $verdict (${dt}s)"
            [ -n "$out" ] && echo "   stdout: $out"
            if [ "$rc" -ne 0 ]; then
              echo "   stderr (последние 12 строк):"
              tail -12 case_err.txt | sed 's/^/     /' || true
            fi
            echo "::$ann::$name → $verdict"
          }

          echo "## MinGW-клиент × bun (Windows CI)" >> "$RES"
          echo "" >> "$RES"
          echo "| кейс | вердикт | время | вывод |" >> "$RES"
          echo "|---|---|---|---|" >> "$RES"

          echo "==== 1/5 selftest KAT ====";            run_case "selftest под -target core2 (якорь)" ./pass.exe -target core2 -- selftest.exe
          echo "==== 1b/5 tname (фикс Godot B-2015) ===="; run_case "tname: 0x406D1388 глотается (MinGW-клиент)" ./pass.exe -target penryn -- tname.exe
          echo "==== 2/5 bun core2 ====";               run_case "pass(MinGW) -target core2 -- bun --version" ./pass.exe -target core2 -- "$BUN_X64" --version
          echo "==== 3/5 bun core2 ====";               run_case "pass(MinGW) -target core2 -- bun -e 'Hello from P.A.S.S.!'" ./pass.exe -target core2 -- "$BUN_X64" -e "console.log('Hello from P.A.S.S.!')"
          echo "==== 4/5 кириллица ====";               run_case "pass(MinGW) -target core2 -- bun -e 'Привет от Bun!'" ./pass.exe -target core2 -- "$BUN_X64" -e "console.log('Привет от Bun!')"
          echo "==== 5/5 baseline ====";                run_case "pass(MinGW) -target core2 -- bun(baseline) --version" ./pass.exe -target core2 -- "$BUN_BASE" --version

          cat "$RES"
          cat "$RES" >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release (tag v*)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PASS-linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: PASS-win-x64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PASS-linux-x64.zip
            PASS-win-x64.zip
          generate_release_notes: true
